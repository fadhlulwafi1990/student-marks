<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Carry Mark Checker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for reading CSV data easily -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Student Carry Mark</h1>
            <p class="text-gray-500 mt-2">Enter your Matrix Number to view your current score.</p>
        </div>

        <!-- Search Form -->
        <form id="searchForm" class="space-y-4">
            <div>
                <label for="matrixInput" class="block text-sm font-medium text-gray-700 mb-1">Matrix Number</label>
                <input type="text" id="matrixInput" required placeholder="e.g., 2023123456" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    autocomplete="off">
            </div>
            <button type="submit" id="searchBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex justify-center items-center">
                <span>Check Mark</span>
            </button>
        </form>

        <!-- Loading State -->
        <div id="loading" class="hidden mt-6 text-center text-blue-600 font-medium">
            Fetching data... please wait.
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="hidden mt-8 border border-gray-200 rounded-lg p-5 bg-gray-50">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">Student Details</h3>
            <div class="space-y-3">
                <div class="flex justify-between">
                    <span class="text-gray-600">Matrix No:</span>
                    <span id="resMatrix" class="font-medium text-gray-900">-</span>
                </div>
                <!-- Optional: Uncomment below if you have a Name column -->
                <!-- <div class="flex justify-between">
                    <span class="text-gray-600">Name:</span>
                    <span id="resName" class="font-medium text-gray-900 text-right">-</span>
                </div> -->
                <div class="flex justify-between items-center pt-2 mt-2 border-t border-gray-200">
                    <span class="text-gray-800 font-semibold">Carry Mark:</span>
                    <span id="resMark" class="text-2xl font-bold text-blue-600">-</span>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMsg" class="hidden mt-6 p-4 bg-red-50 text-red-700 rounded-lg text-sm text-center">
            Student not found or error loading data. Please check your matrix number.
        </div>
    </div>

    <script>
        // --- ADMIN CONFIGURATION ---
        // Your Google Sheet has been converted to an export CSV link here:
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1zcLEwEBj-X1bc74VS3f0bLRoUUBNLeYkHwr_RrN3QFQ/export?format=csv";
        
        // Ensure your Google Sheet columns are named exactly like this in Row 1:
        const COLUMN_MATRIX = "Matrix"; 
        const COLUMN_MARK = "Mark";
        // ---------------------------

        const form = document.getElementById('searchForm');
        const matrixInput = document.getElementById('matrixInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');
        const errorMsg = document.getElementById('errorMsg');

        // UI elements for results
        const resMatrix = document.getElementById('resMatrix');
        const resMark = document.getElementById('resMark');
        // const resName = document.getElementById('resName'); // Uncomment if using name

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const searchTerm = matrixInput.value.trim().toUpperCase();
            
            if(!searchTerm) return;

            // Reset UI
            resultCard.classList.add('hidden');
            errorMsg.classList.add('hidden');
            loading.classList.remove('hidden');
            searchBtn.disabled = true;

            // Fetch and parse data from Google Sheets
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true, // Uses the first row of your sheet as column names
                skipEmptyLines: true,
                complete: function(results) {
                    loading.classList.add('hidden');
                    searchBtn.disabled = false;
                    
                    const data = results.data;
                    let foundStudent = null;

                    // Search for the matrix number in the data
                    for(let i = 0; i < data.length; i++) {
                        // Make sure we have a Matrix column to check
                        if(data[i][COLUMN_MATRIX] && data[i][COLUMN_MATRIX].toString().trim().toUpperCase() === searchTerm) {
                            foundStudent = data[i];
                            break;
                        }
                    }

                    if (foundStudent) {
                        // Display results
                        resMatrix.textContent = foundStudent[COLUMN_MATRIX];
                        resMark.textContent = foundStudent[COLUMN_MARK] !== undefined ? foundStudent[COLUMN_MARK] : "N/A";
                        
                        // resName.textContent = foundStudent["Name"] || "Unknown"; // Uncomment if using Name column
                        
                        resultCard.classList.remove('hidden');
                    } else {
                        // Not found
                        errorMsg.textContent = "Matrix number not found. Please try again.";
                        errorMsg.classList.remove('hidden');
                    }
                },
                error: function(err) {
                    loading.classList.add('hidden');
                    searchBtn.disabled = false;
                    errorMsg.textContent = "Error connecting to the database. Please ensure the Google Sheet is shared as 'Anyone with the link'.";
                    errorMsg.classList.remove('hidden');
                    console.error("PapaParse Error:", err);
                }
            });
        });
    </script>
</body>
</html>
